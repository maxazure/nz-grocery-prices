[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nz-grocery-prices"
version = "0.1.0"
description = "CLI to fetch fresh produce and meat prices from PAK'nSAVE and New World stores."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Liu Jie", email = "maxazure@gmail.com" }]
maintainers = [{ name = "Liu Jie", email = "maxazure@gmail.com" }]
keywords = [
    "new-zealand",
    "nz",
    "supermarket",
    "grocery",
    "prices",
    "paknsave",
    "new-world",
    "auckland",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Utilities",
]
dependencies = [
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://github.com/maxazure/nz-grocery-prices"
Repository = "https://github.com/maxazure/nz-grocery-prices"
Issues = "https://github.com/maxazure/nz-grocery-prices/issues"
Changelog = "https://github.com/maxazure/nz-grocery-prices/releases"

[project.scripts]
nzgrocery = "nzgrocery.cli:main"
# Same entry point under the distribution name, so `uvx nz-grocery-prices`
# and `pipx run nz-grocery-prices` work without `--from`.
nz-grocery-prices = "nzgrocery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nzgrocery = ["stores/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
